<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nikolasmelui</title>
    <meta name="description"
          content="Full-stack web developer (backend based) with 10+ years of experience. Head of VoxEngine &amp; DevTools at Voximplant."/>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        .crt {
            position: fixed;
            inset: 0;
            background: #000;
            color: #39ff14;
            font-family: "Lucida Console", "Courier New", Courier, monospace;
            font-size: clamp(14px, 1.6vw, 18px);
            line-height: 1.35;
            text-shadow: 0 0 4px rgba(57, 255, 20, 0.85),
            0 0 12px rgba(57, 255, 20, 0.45),
            0 0 28px rgba(57, 255, 20, 0.2);
        }

        .crt::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(
                    0deg,
                    rgba(0, 0, 0, 0.15) 0px,
                    rgba(0, 0, 0, 0.15) 1px,
                    transparent 1px,
                    transparent 3px
            );
            z-index: 3;
            opacity: 0.55;
        }

        .crt::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.65) 100%);
            z-index: 4;
        }

        .screen-flash {
            animation: flash 0.12s ease-out;
        }

        @keyframes flash {
            0% {
                filter: brightness(2.4);
            }

            100% {
                filter: brightness(1);
            }
        }

        .terminal {
            position: relative;
            z-index: 1;
            height: 100%;
            padding: 1.25rem 1.5rem 2.5rem;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .terminal-output {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            white-space: pre-wrap;
            word-break: break-word;
            scrollbar-width: thin;
            scrollbar-color: #1a3a1a #000;
        }

        .terminal-output::-webkit-scrollbar {
            width: 6px;
        }

        .terminal-output::-webkit-scrollbar-thumb {
            background: #1a3a1a;
        }

        .cursor {
            display: inline-block;
            width: 0.62em;
            height: 1.05em;
            margin-left: 1px;
            vertical-align: text-bottom;
            background: #39ff14;
            box-shadow: 0 0 8px #39ff14;
            animation: blink 1s step-end infinite;
        }

        .cursor.off {
            opacity: 0;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        .hud {
            position: fixed;
            z-index: 5;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            padding: 0.5rem 1.25rem;
            font-size: 0.7rem;
            color: #1f7a1f;
            text-shadow: none;
            opacity: 0.7;
            pointer-events: none;
        }

        .secret {
            position: fixed;
            left: 0;
            top: 0;
            width: 8px;
            height: 100%;
            z-index: 6;
            cursor: pointer;
        }

        .secret:hover {
            background: rgba(57, 255, 20, 0.06);
        }
    </style>
</head>

<body>
<div class="crt" id="crt">
    <div class="terminal">
        <div class="terminal-output" id="output" aria-live="polite">
            <span id="typed"></span><span class="cursor" id="cursor" aria-hidden="true"></span>
        </div>
    </div>
</div>

<div class="hud" aria-hidden="true">
    <span id="mode-label">typing</span>
    <span>type a command · enter to run · enter while typing to speed up · info · cv</span>
</div>

<div class="secret" title="help" aria-label="Run help"></div>

<script>
    const FAST_MULTIPLIER = 0.1;

    let typingToken = 0;
    let infoText = '';
    let cvText = '';
    let baseScreen = '';
    let inputBuffer = '';

    const crt = document.getElementById('crt');
    const typedEl = document.getElementById('typed');
    const cursorEl = document.getElementById('cursor');
    const outputEl = document.getElementById('output');
    const modeLabel = document.getElementById('mode-label');

    let isTyping = false;
    let interactive = false;
    let fastMode = false;
    let phase = 'boot';

    function formatCvPlain(cv) {
        const jobs = cv.work?.positions || [];
        const current = jobs.find((w) => w.actual);
        const sections = [
            `// ${cv.name} · ${cv.role}`,
            `// ${cv.place} · ${cv.experience}`,
            '',
            JSON.stringify(
                {
                    name: cv.name,
                    role: cv.role,
                    headline: cv.headline,
                    experience: cv.experience,
                    contacts: cv.contacts,
                    skills: cv.skills,
                    interested: cv.interested,
                    love: cv.love,
                    current: current
                        ? { company: current.company, position: current.position }
                        : null,
                },
                null,
                2,
            ),
            '',
            '// work.positions[]',
            ...jobs.map((job) => {
                const tag = job.actual ? '[current]' : '[past]';
                const projects = (job.projects || [])
                    .map((p) => `  - ${p.title} (${p.role})`)
                    .join('\n');
                const header = `${tag} ${job.position} @ ${job.company}`;
                return projects ? `${header}\n${projects}` : header;
            }),
            '',
            '// community[]',
            ...(cv.community || []).map((c) => `  - ${c.title}: ${c.org}`),
        ];

        return sections.join('\n');
    }

    function helpText() {
        return [
            '',
            '> help — available commands',
            '  info                 who am I',
            '  cv                   curriculum vitae',
            '',
            '> tip: press Enter while printing to speed up',
            '',
        ].join('\n');
    }

    function promptLine() {
        return '> ';
    }

    function bootScript() {
        return [
            '',
            'Wake up, %username%...',
            'The AI world and all the neuroslope has you...',
            `Follow the... I don't know... common sense, white rabbit, or some other bullshit.`,
            '',
            '... knock knock.',
            '',
            '> remote session opened',
            '> host: nikolasmelui.github.io',
            '> channel: secure / green',
            '',
            '> type a command',
            '',
            promptLine(),
        ].join('\n');
    }

    function commandOutput(name, body) {
        return ['', `> ${name}`, '', body, '', promptLine()].join('\n');
    }

    function unknownOutput(raw) {
        return [
            '',
            `command not found: ${raw}`,
            'try: help',
            '',
            promptLine(),
        ].join('\n');
    }

    function updateModeLabel() {
        if (isTyping) {
            const speed = fastMode ? ' · fast' : '';
            modeLabel.textContent = `typing · ${phase}${speed}`;
            return;
        }
        if (interactive) {
            modeLabel.textContent = 'interactive';
            return;
        }
        modeLabel.textContent = typedEl.textContent ? 'done' : 'ready';
    }

    function renderInput() {
        typedEl.textContent = baseScreen + inputBuffer;
        cursorEl.classList.remove('off');
        outputEl.scrollTop = outputEl.scrollHeight;
    }

    function enableFastMode() {
        if (fastMode) return;
        fastMode = true;
        updateModeLabel();
    }

    function flashScreen() {
        crt.classList.remove('screen-flash');
        void crt.offsetWidth;
        crt.classList.add('screen-flash');
    }

    function stripCvMarkers(text) {
        const start = '<!-- cv:start -->';
        const end = '<!-- cv:end -->';
        const i = text.indexOf(start);
        const j = text.indexOf(end);
        if (i === -1 || j === -1) return text.trim();
        return text.slice(i + start.length, j).trim();
    }

    function markdownToTerminal(text) {
        return text
            .replace(/\r\n/g, '\n')
            .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '$1 <$2>')
            .replace(/\*\*([^*]+)\*\*/g, '$1')
            .replace(/<!--[\s\S]*?-->/g, '')
            .replace(/[ \t]+$/gm, '')
            .trim();
    }

    function delay(ms) {
        return new Promise((resolve) => {
            window.setTimeout(resolve, ms);
        });
    }

    function baseCharDelay(char, prevChar) {
        if (char === '\n') {
            if (prevChar === '\n') return 220 + Math.random() * 180;
            return 90 + Math.random() * 120;
        }
        if (char === '.') return 140 + Math.random() * 200;
        if (char === '>' || char === '_') return 35 + Math.random() * 45;
        if (char === ' ') return 18 + Math.random() * 28;
        return 12 + Math.random() * 38;
    }

    function charDelay(char, prevChar) {
        const base = baseCharDelay(char, prevChar);
        if (!fastMode) return base;
        return Math.max(1, Math.round(base * FAST_MULTIPLIER));
    }

    async function typeText(text, token, { clear = true, keepCursor = false } = {}) {
        if (clear) typedEl.textContent = '';
        cursorEl.classList.remove('off');
        let buffer = clear ? '' : typedEl.textContent;

        for (let i = 0; i < text.length; i += 1) {
            if (token !== typingToken) return false;

            const char = text[i];
            const prev = i > 0 ? text[i - 1] : '';

            if (char === '\n' && buffer.endsWith('...')) {
                flashScreen();
            }

            buffer += char;
            typedEl.textContent = buffer;
            outputEl.scrollTop = outputEl.scrollHeight;

            await delay(charDelay(char, prev));
        }

        if (token !== typingToken) return false;

        if (!keepCursor) cursorEl.classList.add('off');
        isTyping = false;
        updateModeLabel();
        return true;
    }

    function enterInteractive() {
        interactive = true;
        fastMode = false;
        inputBuffer = '';
        cursorEl.classList.remove('off');
        updateModeLabel();
    }

    async function startBoot() {
        typingToken += 1;
        const token = typingToken;
        phase = 'boot';
        interactive = false;
        inputBuffer = '';
        fastMode = false;
        isTyping = true;
        updateModeLabel();

        flashScreen();
        await delay(280);

        const ok = await typeText(bootScript(), token, { clear: true, keepCursor: true });
        if (!ok) return;

        baseScreen = typedEl.textContent;
        enterInteractive();
    }

    function normalizeCommand(raw) {
        return raw.trim().toLowerCase().replace(/\s+/g, ' ');
    }

    function resolveCommand(raw) {
        const cmd = normalizeCommand(raw);
        if (!cmd) return { kind: 'empty' };

        if (cmd === 'help' || cmd === '?' || cmd === 'h') {
            return { kind: 'help' };
        }
        if (
            cmd === 'info' ||
            cmd === 'i' ||
            cmd === 'readme' ||
            cmd === 'r' ||
            cmd === 'cat readme' ||
            cmd === 'cat readme.md'
        ) {
            return { kind: 'info' };
        }
        if (
            cmd === 'cv' ||
            cmd === 'c' ||
            cmd === 'cat cv' ||
            cmd === 'cat cv.json'
        ) {
            return { kind: 'cv' };
        }
        if (cmd === 'clear' || cmd === 'cls') {
            return { kind: 'clear' };
        }

        return { kind: 'unknown', raw: raw.trim() };
    }

    async function runCommand(raw) {
        const resolved = resolveCommand(raw);
        if (resolved.kind === 'empty') {
            baseScreen = typedEl.textContent + '\n' + promptLine();
            inputBuffer = '';
            renderInput();
            return;
        }

        typingToken += 1;
        const token = typingToken;
        interactive = false;
        fastMode = false;
        isTyping = true;
        phase = resolved.kind;
        updateModeLabel();

        let text = '';

        if (resolved.kind === 'help') {
            text = helpText() + promptLine();
        } else if (resolved.kind === 'info') {
            text = commandOutput('info', infoText);
        } else if (resolved.kind === 'cv') {
            text = commandOutput('cv', cvText);
        } else if (resolved.kind === 'clear') {
            flashScreen();
            await delay(120);
            if (token !== typingToken) return;
            typedEl.textContent = '';
            baseScreen = promptLine();
            inputBuffer = '';
            isTyping = false;
            enterInteractive();
            renderInput();
            return;
        } else {
            text = unknownOutput(resolved.raw);
        }

        flashScreen();
        await delay(180);

        const ok = await typeText(text, token, { clear: false, keepCursor: true });
        if (!ok) return;

        baseScreen = typedEl.textContent;
        enterInteractive();
        outputEl.scrollTop = outputEl.scrollHeight;
    }

    function stripForTerminal(text) {
        return markdownToTerminal(stripCvMarkers(text));
    }

    async function loadSources() {
        const cv = await fetch('cv.json').then((r) => {
            if (!r.ok) throw new Error('cv.json not found');
            return r.json();
        });
        cvText = formatCvPlain(cv);

        try {
            const response = await fetch('README.md');
            if (!response.ok) throw new Error('README.md not found');
            infoText = stripForTerminal(await response.text());
        } catch {
            const current = (cv.work?.positions || []).find((w) => w.actual);
            infoText = `${cv.headline} · ${cv.experience} · ${cv.role}${current ? ` at ${current.company}` : ''}`;
        }
    }

    function isPrintableKey(event) {
        if (event.ctrlKey || event.metaKey || event.altKey) return false;
        if (event.key.length !== 1) return false;
        return true;
    }

    document.querySelector('.secret').addEventListener('click', () => {
        if (!interactive || isTyping) return;
        inputBuffer = 'help';
        renderInput();
        runCommand(inputBuffer);
    });

    window.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && isTyping) {
            event.preventDefault();
            enableFastMode();
            return;
        }

        if (!interactive || isTyping) return;

        if (event.key === 'Enter') {
            event.preventDefault();
            const command = inputBuffer;
            runCommand(command);
            return;
        }

        if (event.key === 'Backspace') {
            event.preventDefault();
            if (!inputBuffer) return;
            inputBuffer = inputBuffer.slice(0, -1);
            renderInput();
            return;
        }

        if (event.key === 'Escape') {
            event.preventDefault();
            inputBuffer = '';
            renderInput();
            return;
        }

        if (isPrintableKey(event)) {
            event.preventDefault();
            inputBuffer += event.key;
            renderInput();
        }
    });

    loadSources().then(() => startBoot());
</script>
</body>

</html>
